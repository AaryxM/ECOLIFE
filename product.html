<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product – EcoLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f4d2e">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EcoLife">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
<div id="site-header"></div>
<div style="background:var(--cream);height:60px"></div>
<main class="container">
  <section class="product" id="product"></section>
  <section class="details">
    <h2>Product details</h2>
    <div class="details-grid">
      <div>
        <h3>Rooted in nature.<br>Made for your everyday.</h3>
        <p style="color:var(--muted);margin-top:18px;font-size:14px">Wrapped in natural materials and designed to bring a simple, earthy feel to everyday life. <span id="d-name"></span> adds warmth, comfort and character.</p>
        <div id="d-img"></div>
      </div>
      <div><h3 style="font-size:32px;margin-bottom:18px">Thoughtfully formulated.</h3><div class="acc" id="accordion"></div></div>
    </div>
  </section>
  <section class="like"><h2 style="margin-bottom:20px">You might also like</h2><div class="grid" id="like"></div></section>
</main>
<div id="site-footer"></div>
<script src="js/main.js"></script>
</body>
</html>
