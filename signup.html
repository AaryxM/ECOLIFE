<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up – EcoLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup">
<main class="auth"><div class="auth-stage">
  <div class="auth-art" aria-hidden="true">🍶🧺🧼</div>
  <div class="auth-card">
    <a href="index.html" class="logo" aria-label="EcoLife home">ECO&#127807;L<i>i</i>FE</a>
    <h1>Create account</h1><p class="sub">Sign Up to begin your journey</p>
    <form id="auth-form" novalidate>
      <label class="field"><span class="i">👤</span><input name="name" placeholder="Full Name" autocomplete="name"></label>
      <label class="field"><span class="i">✉️</span><input name="email" type="email" placeholder="Email Address" autocomplete="email"></label>
      <label class="field"><span class="i">🔒</span><input name="password" type="password" placeholder="Password" autocomplete="new-password"></label>
      <label class="terms"><input type="checkbox" name="terms"><span>I agree to the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>.</span></label>
      <div class="form-err" id="form-err" role="alert"></div>
      <button class="btn btn-olive" type="submit">Sign Up →</button>
    </form>
    <p class="alt">Already have an account? <a href="login.html">Log In</a></p>
  </div>
</div></main>
<script src="js/main.js"></script>
</body>
</html>
